name: Apply desktop managed server lifecycle
on:
  push:
    branches:
      - main
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Apply lifecycle patch
        run: python3 .github/scripts/apply-desktop-server-lifecycle.py
      - name: Check launcher syntax
        run: node --check desktop/scripts/dev.js && node --check desktop/scripts/prepare-server-runtime.js
      - name: Build server
        working-directory: server
        run: npm run build
      - name: Check desktop
        working-directory: desktop
        run: npm run typecheck && npm test && npm run build
      - name: Prepare packaged runtime
        working-directory: desktop
        run: npm run prepare:server-runtime
      - name: Smoke managed runtime
        run: node .github/scripts/smoke-managed-server-runtime.js
      - name: Commit verified runtime fix
        run: |
          rm .github/scripts/apply-desktop-server-lifecycle.py
          rm .github/scripts/smoke-managed-server-runtime.js
          rm .github/workflows/apply-desktop-managed-server-lifecycle.yml
          rm -rf desktop/packaging-resources/server-runtime .tmp-managed-server-data
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add desktop/src/main/main.ts desktop/scripts/dev.js desktop/scripts/prepare-server-runtime.js .github/scripts/apply-desktop-server-lifecycle.py .github/scripts/smoke-managed-server-runtime.js .github/workflows/apply-desktop-managed-server-lifecycle.yml
          git commit -m "fix: manage desktop server lifecycle"
          git push origin HEAD:main
