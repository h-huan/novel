name: Apply desktop managed server lifecycle
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply desktop managed server lifecycle'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Apply lifecycle patch
        run: python3 .github/scripts/apply-desktop-server-lifecycle.py
      - name: Syntax checks
        run: |
          node --check desktop/scripts/dev.js
          node --check desktop/scripts/prepare-server-runtime.js
      - name: Build server
        working-directory: server
        run: npm run build
      - name: Desktop typecheck
        working-directory: desktop
        run: npm run typecheck
      - name: Desktop unit tests
        working-directory: desktop
        run: npm test
      - name: Desktop build
        working-directory: desktop
        run: npm run build
      - name: Prepare packaged server runtime
        working-directory: desktop
        run: npm run prepare:server-runtime
      - name: Managed server runtime smoke test
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { spawn } = require('node:child_process');

          const runtimeRoot = path.resolve('desktop/packaging-resources/server-runtime');
          const nodeBin = path.join(runtimeRoot, process.platform === 'win32' ? 'node.exe' : 'node');
          const entry = path.join(runtimeRoot, 'src', 'main.js');
          if (!fs.existsSync(nodeBin)) throw new Error(`runtime node missing: ${nodeBin}`);
          if (!fs.existsSync(entry)) throw new Error(`runtime entry missing: ${entry}`);
          if (process.platform !== 'win32') fs.chmodSync(nodeBin, 0o755);
          const dataDir = path.resolve('.tmp-managed-server-data');
          fs.rmSync(dataDir, { recursive: true, force: true });
          const child = spawn(nodeBin, [entry], {
            cwd: runtimeRoot,
            env: {
              ...process.env,
              PORT: '3199',
              SERVER_PORT: '3199',
              DATA_DIR: dataDir,
              NOVEL_MANAGED_SERVER: '1',
              NODE_ENV: 'test',
            },
            stdio: ['ignore', 'pipe', 'pipe', 'ipc'],
          });
          let output = '';
          child.stdout.on('data', chunk => { output += String(chunk); });
          child.stderr.on('data', chunk => { output += String(chunk); });
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const deadline = Date.now() + 30000;
          let healthy = false;
          while (Date.now() < deadline) {
            if (child.exitCode !== null) throw new Error(`managed server exited early: ${child.exitCode}\n${output}`);
            try {
              const res = await fetch('http://127.0.0.1:3199/api/v1/health', { signal: AbortSignal.timeout(1000) });
              const body = res.ok ? await res.json() : null;
              if (body?.status === 'ok') { healthy = true; break; }
            } catch {}
            await sleep(250);
          }
          if (!healthy) {
            child.kill('SIGKILL');
            throw new Error(`managed server did not become healthy\n${output}`);
          }
          child.send({ type: 'shutdown' });
          const exited = await Promise.race([
            new Promise(resolve => child.once('exit', () => resolve(true))),
            sleep(10000).then(() => false),
          ]);
          if (!exited) {
            child.kill('SIGKILL');
            throw new Error(`managed server did not stop after IPC shutdown\n${output}`);
          }
          fs.rmSync(dataDir, { recursive: true, force: true });
          console.log('managed server startup/health/shutdown smoke passed');
          NODE
      - name: Commit verified runtime fix
        run: |
          rm .github/scripts/apply-desktop-server-lifecycle.py
          rm .github/workflows/apply-desktop-managed-server-lifecycle.yml
          rm -rf desktop/packaging-resources/server-runtime .tmp-managed-server-data
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add desktop/src/main/main.ts desktop/scripts/dev.js desktop/scripts/prepare-server-runtime.js .github/scripts/apply-desktop-server-lifecycle.py .github/workflows/apply-desktop-managed-server-lifecycle.yml
          git commit -m "fix: manage desktop server lifecycle"
          git push origin HEAD:main
