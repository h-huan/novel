      scopeBreakdown: [{ arc: '全篇主线', chapters: 5, reason: '五章完成调查、选择和兑现' }],
      scopeReason: '两万字按五章展开，每章约四千字。', setting: '现代城市', characters: ['主角', '母亲'], styleTags: ['现实悬疑'],
