    controller.ideaAppealGate = new IdeaAppealGateService();
    controller.logger = { log: vi.fn(), warn: vi.fn(), error: vi.fn(), debug: vi.fn() };
    controller.db = {
      getDb: () => ({
        prepare: () => ({ all: () => [] }),
      }),
    };

    const result = await controller.runIdeaDiscovery({
