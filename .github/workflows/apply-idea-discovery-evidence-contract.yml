      storyTone: ['紧张'], writingStyle: ['简洁'], webNovelGenre: ['悬疑推理'],
      submissionTags: ['悬疑'], plotTags: ['调查'], genreFitNote: '', pov: '第一人称',
      targetWords: '20000', storyCategory: '悬疑', targetAudience: '',
    }, 2);

