name: Apply idea discovery evidence contract fix
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply idea discovery evidence contract fix'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Apply semantic evidence contract patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s), found {actual}: {old[:120]!r}')
              text = text.replace(old, new, count)
              p.write_text(text, encoding='utf-8')

          contract = 'server/src/chain/idea-discovery-contract.ts'
          replace(contract,
          "export const SHORT_IDEA_HOOK_MIN_SIGNALS = 3;\n\nconst SELECTED_PREMISE_FIELDS = [",
          "export const SHORT_IDEA_HOOK_MIN_SIGNALS = 3;\n\n// 创建前筛选已经形成了结构化语义证据。它只在当前进程内随服务器绑定的题材卡流转，\n// 不进入 JSON / API / Canon，避免最终 Gate 丢掉上游证据后又靠关键词重新猜同一件事。\nconst selectedPremiseEvidenceByCard = new WeakMap<object, Record<string, unknown>>();\n\nexport function selectedPremiseEvidenceForIdeaCard(value: unknown): Record<string, unknown> | null {\n  if (!value || typeof value !== 'object') return null;\n  const evidence = selectedPremiseEvidenceByCard.get(value as object);\n  return evidence ? { ...evidence } : null;\n}\n\nconst SELECTED_PREMISE_FIELDS = [")

          replace(contract,
          "  return { ...safeCard, sourcePremiseId: premiseId };",
          "  const boundCard = { ...safeCard, sourcePremiseId: premiseId };\n  selectedPremiseEvidenceByCard.set(boundCard, { ...selectedPremise });\n  return boundCard;")

          replace(contract,
          "  return cards.map((card, index) => {\n    const patch = ideaRepairRecord(rawPatches[index]);",
          "  return cards.map((card, index) => {\n    const selectedPremiseEvidence = selectedPremiseEvidenceForIdeaCard(card);\n    const patch = ideaRepairRecord(rawPatches[index]);")

          replace(contract,
          "    // 显式恢复服务器持有的身份，哪怕模型在未知字段里试图改写也不会生效。\n    next.sourcePremiseId = card.sourcePremiseId;\n    return next;",
          "    // 显式恢复服务器持有的身份，哪怕模型在未知字段里试图改写也不会生效。\n    next.sourcePremiseId = card.sourcePremiseId;\n    if (selectedPremiseEvidence) {\n      selectedPremiseEvidenceByCard.set(next, selectedPremiseEvidence);\n    }\n    return next;")

          gate = 'server/src/chain/idea-appeal-gate.service.ts'
          replace(gate,
          "import { SHORT_IDEA_HOOK_MIN_SIGNALS } from './idea-discovery-contract';",
          "import { SHORT_IDEA_HOOK_MIN_SIGNALS, selectedPremiseEvidenceForIdeaCard } from './idea-discovery-contract';")

          replace(gate,
          "    const all = textOf(idea);\n\n    const titleAnchored = titleHasStoryAnchor(title, `${hook}；${description}；${uniquePoint}；${coreConflict}；${mainReversal}；${noveltyEvidence}`);\n    const hookHasAnomaly = ANOMALY.test(hook);\n    const hookHasPressure = PRESSURE.test(hook);\n    const hookHasAgency = AGENCY.test(hook) || FIRST_PERSON_ACTION.test(hook) || CONCRETE_ACTION.test(hook) || HOOK_CHOICE.test(hook);",
          "    const all = textOf(idea);\n    const selectedPremiseEvidence = selectedPremiseEvidenceForIdeaCard(idea);\n    const evidenceText = (field: string) => String(selectedPremiseEvidence?.[field] || '').trim();\n    // 只有服务器从“创建前筛选”绑定过的卡才能使用这些语义证据。普通外部对象、历史卡和\n    // 直接调用 Gate 的数据仍必须靠卡片自身文本成立，不能伪造 selectedPremise 字段绕过验收。\n    const boundPremiseEvidence = hook.length >= 24 && selectedPremiseEvidence !== null;\n    const selectedOpeningEvidence = boundPremiseEvidence\n      && evidenceText('openingEvent').length >= 8\n      && evidenceText('readerQuestion').length >= 8;\n    const selectedPressureEvidence = boundPremiseEvidence\n      && evidenceText('coreConflict').length >= 8\n      && (evidenceText('escalation').length >= 8 || evidenceText('protagonistSituation').length >= 8);\n    const selectedAgencyEvidence = boundPremiseEvidence && evidenceText('activeChoice').length >= 8;\n\n    const titleAnchored = titleHasStoryAnchor(title, `${hook}；${description}；${uniquePoint}；${coreConflict}；${mainReversal}；${noveltyEvidence}`);\n    const hookHasAnomaly = ANOMALY.test(hook) || selectedOpeningEvidence;\n    const hookHasPressure = PRESSURE.test(hook) || selectedPressureEvidence;\n    const hookHasAgency = AGENCY.test(hook) || FIRST_PERSON_ACTION.test(hook) || CONCRETE_ACTION.test(hook) || HOOK_CHOICE.test(hook) || selectedAgencyEvidence;")

          contract_spec = 'server/src/chain/idea-discovery-contract.spec.ts'
          replace(contract_spec,
          "  normalizePremiseSelectionPayload,\n} from './idea-discovery-contract';",
          "  normalizePremiseSelectionPayload,\n  selectedPremiseEvidenceForIdeaCard,\n} from './idea-discovery-contract';")
          with Path(contract_spec).open('a', encoding='utf-8') as f:
              f.write(r'''

describe('server-owned selected-premise evidence', () => {
  it('keeps preselection evidence off the API card while making it available to the final Gate', () => {
    const premise = selectedPremise('P-evidence');
    const card = bindStructuredIdeaCardToPremise(premise, [{
      title: '证据绑定题材',
      hook: '这是一段足够长的自然语言钩子，用来确认服务器内部证据不会暴露到返回 JSON。',
    }]);

    expect(selectedPremiseEvidenceForIdeaCard(card)).toEqual(expect.objectContaining({
      premiseId: 'P-evidence',
      activeChoice: premise.activeChoice,
      openingEvent: premise.openingEvent,
    }));
    expect(JSON.stringify(card)).not.toContain('activeChoice');
    expect(JSON.stringify(card)).not.toContain('protagonistSituation');
  });

  it('preserves the same server-owned evidence across a bounded local repair clone', () => {
    const premise = selectedPremise('P-repair-evidence');
    const card = bindStructuredIdeaCardToPremise(premise, [{
      title: '修复后仍绑定',
      hook: '原钩子已经足够长，但自然表达可能没有命中固定动词词表。',
    }]);
    const repaired = applyOrderedIdeaRepairPatches([card], [{ hook: '修复后钩子仍然只改变允许修改的文本字段，题材身份和前置证据都应保留。' }])[0];

    expect(selectedPremiseEvidenceForIdeaCard(repaired)).toEqual(expect.objectContaining({
      premiseId: 'P-repair-evidence',
      activeChoice: premise.activeChoice,
    }));
  });
});
''')

          gate_spec = 'server/src/chain/idea-appeal-gate.story-regression.spec.ts'
          replace(gate_spec,
          "import { IdeaAppealGateService } from './idea-appeal-gate.service';",
          "import { IdeaAppealGateService } from './idea-appeal-gate.service';\nimport { bindStructuredIdeaCardToPremise } from './idea-discovery-contract';")
          with Path(gate_spec).open('a', encoding='utf-8') as f:
              f.write(r'''

describe('selected-premise semantic evidence survives wording variation', () => {
  it('does not require a new regex keyword every time the same selected story is phrased differently', () => {
    const rawCard = {
      title: '反诈室友让我继续打钱',
      hook: '对面发来的话术和反诈客服室友工作群里的样本一模一样。下月房租全靠这笔押金，她仍把钱打过去，把手机交给室友全程录屏，自己继续聊。',
      description: '她只想拿回押金续住房子。第一轮交钱后，对方立刻换了收款人；随后室友发现话术来自正在追踪的团伙。她继续装作上钩，把聊天和转账路径留作证据。最后她必须在马上止损和继续拖住对方之间选择，因为室友所在团队只差最后一条资金链就能锁定收款人。',
      protagonist: '租约快到期、想拿回押金继续住下去的普通上班族。',
      coreConflict: '她要保住下月住处和押金，同时配合室友拖住骗子，任何一步提前收手都会断掉资金证据。',
      uniquePoint: '诈骗话术和反诈客服室友工作群里的样本完全重合，而主角必须假装继续上钩。',
      mainReversal: '她以为室友只是在帮她止损，后来才知道室友追的正是同一团伙；两人的目标从救一笔押金改成保住房子同时锁住资金链。',
      noveltyProof: {
        familiarShell: '合租生活加反诈悬疑',
        uncommonCombination: '租房押金、反诈客服室友和实时诈骗话术样本绑定在同一场转账里',
        avoidedPatterns: '不靠超能力或身份曝光解决诈骗',
        irreplaceableWhy: '去掉合租与押金压力，主角没有继续冒险的现实代价；去掉反诈室友，实时话术比对和录屏证据链不成立',
        secondOrderConsequence: '她继续聊天会让骗子把目标扩展到同住地址，室友也必须在保护她与追完整资金链之间重新选择',
        readerQuestion: '这笔押金到底能不能拿回来，室友为什么要求她明知有风险还继续聊下去？',
      },
    };
    const unbound = gate.assess(rawCard, 'short_story');
    expect(unbound.signals.hookHasAnomaly).toBe(false);
    expect(unbound.signals.hookHasPressure).toBe(false);
    expect(unbound.signals.hookHasAgency).toBe(false);

    const bound = bindStructuredIdeaCardToPremise({
      premiseId: 'P-natural-wording',
      workingTitle: rawCard.title,
      storyCore: '租客发现押金骗局话术与反诈室友追踪样本重合，决定继续装作上钩留下证据。',
      protagonistSituation: '租约快到期，她需要拿回押金才能保住下月住处。',
      openingEvent: '诈骗方发来的整套话术与反诈客服室友工作群里的追踪样本重合。',
      coreConflict: '她要保住押金和住处，同时拖住骗子让室友补齐资金链，两项目标互相制造风险。',
      activeChoice: '她明知对面是骗子仍决定按原节奏继续聊，把手机交给室友录屏并保留转账路径。',
      escalation: '继续配合让诈骗方扩大目标范围，也让室友必须在立即止损和追完整资金链之间取舍。',
      reversalEffect: '室友并非临时帮忙，而是在追同一团伙，私人押金纠纷变成共同承担风险的取证行动。',
      payoff: '终局必须同时兑现押金去向、资金链证据和两人对风险边界的选择。',
      irreplaceableCarrier: '合租关系带来即时反诈协作，押金又提供不能简单退出的现实利益。',
      secondOrderConsequence: '骗子把目标扩展到同住地址后，室友的职业追查会反过来威胁两人的现实住处安全。',
      readerQuestion: '明知被骗为什么还继续聊，这次继续会让她拿回押金还是失去住处？',
      differentiation: '冲突来自租房现金流和反诈室友的实时协作，而不是发现秘密后一路调查。',
    }, [rawCard]);
    const assessment = gate.assess(bound, 'short_story');
    expect(assessment.signals.hookHasAnomaly).toBe(true);
    expect(assessment.signals.hookHasPressure).toBe(true);
    expect(assessment.signals.hookHasAgency).toBe(true);
    expect(assessment.issues).not.toContain('核心钩子没有迫使主角采取具体行动或明确选择');
    expect(assessment.issues.some((item) => item.includes('短篇首屏钩子信息过弱'))).toBe(false);
  });
});
''')

          planning_spec = 'server/src/chain/chain-planning.controller.idea-appeal.spec.ts'
          p = Path(planning_spec)
          text = p.read_text(encoding='utf-8-sig')
          text = text.replace("schemaVersion: 4,\n  mode: 'premise_preselection_then_final_reader_experience_gate',",
                              "schemaVersion: 7,\n  mode: 'premise_preselection_then_final_gate_bounded_repair',\n  structuringProtocol: 'one_selected_premise_per_call_server_owned_identity',\n  repairProtocol: 'ordered_local_patch_server_owned_identity',")
          text = text.replace("mode: 'premise_preselection_then_final_reader_experience_gate'", "mode: 'premise_preselection_then_final_gate_bounded_repair'")
          if "schemaVersion: 4" in text or "premise_preselection_then_final_reader_experience_gate" in text:
              raise SystemExit('stale idea discovery audit fixture remains')
          p.write_text(text, encoding='utf-8')

          helpers = 'server/src/chain/chain.controller.helpers.spec.ts'
          replace(helpers,
          "import { GateRejectionError, classifyGateFailure } from '../modules/writing-quality/gate-failure';",
          "import { GateRejectionError, classifyGateFailure } from '../modules/writing-quality/gate-failure';\nimport { IdeaAppealGateService } from './idea-appeal-gate.service';")
          with Path(helpers).open('a', encoding='utf-8') as f:
              f.write(r'''

describe('idea discovery live orchestrator behavior', () => {
  it('returns the final-gate-passed subset instead of zeroing a batch when one selected premise still fails', async () => {
    const selected = (id: string, title: string) => ({
      premiseId: id,
      workingTitle: title,
      storyCore: `${title}的具体人物处境、起始事件与冲突骨架。`,
