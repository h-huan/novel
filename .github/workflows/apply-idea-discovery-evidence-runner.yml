name: Apply idea evidence contract patch
on:
  push:
    branches:
      - main
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Execute checked patch script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-idea-discovery-evidence-contract.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index("\n          PY", start)
          code = source[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in code.splitlines())
          exec(compile(code, 'idea-evidence-patch.py', 'exec'))
          PY
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Typecheck
        working-directory: server
        run: npm run typecheck
      - name: Focused regressions
        working-directory: server
        run: npx vitest run src/chain/idea-discovery-contract.spec.ts src/chain/idea-appeal-gate.service.spec.ts src/chain/idea-appeal-gate.story-regression.spec.ts src/chain/chain-planning.controller.idea-appeal.spec.ts src/chain/chain-route-architecture.spec.ts src/chain/chain.controller.helpers.spec.ts
      - name: Commit patch and remove temporary runners
        run: |
          rm .github/workflows/apply-idea-discovery-evidence-contract.yml
          rm .github/workflows/apply-idea-discovery-evidence-runner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve preselection evidence through idea gate'
          git push origin main
