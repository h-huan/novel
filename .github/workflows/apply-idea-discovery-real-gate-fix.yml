name: Apply real idea discovery gate fix

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_idea_discovery_real_gate.py'
      - '.github/workflows/apply-idea-discovery-real-gate-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Apply patch
        run: python .github/scripts/fix_idea_discovery_real_gate.py
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Typecheck
        working-directory: server
        run: npm run typecheck
      - name: Focused regressions
        working-directory: server
        run: npx vitest run src/chain/idea-appeal-gate.service.spec.ts src/chain/chain-route-architecture.spec.ts src/acceptance/generation-diagnostics.acceptance.spec.ts
      - name: Commit fix and remove temporary runner
        run: |
          rm .github/scripts/fix_idea_discovery_real_gate.py
          rm .github/workflows/apply-idea-discovery-real-gate-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/src/chain/idea-appeal-gate.service.ts server/src/chain/chain.controller.ts server/src/chain/chain-route-architecture.spec.ts server/src/chain/idea-appeal-gate.service.spec.ts .github/scripts/fix_idea_discovery_real_gate.py .github/workflows/apply-idea-discovery-real-gate-fix.yml
          git commit -m 'fix: stop false-zero idea discovery batches'
          git push origin HEAD:main
