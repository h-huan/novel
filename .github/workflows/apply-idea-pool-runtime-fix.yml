name: Apply idea pool runtime fix
# one-time runner; deletes itself after the verified source commit

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-idea-pool-runtime-fix.yml'
      - '.github/scripts/apply-idea-pool-runtime-fix.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply runtime patch
        run: python .github/scripts/apply-idea-pool-runtime-fix.py

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Typecheck server
        working-directory: server
        run: npm run typecheck

      - name: Run focused tests
        working-directory: server
        run: npm test -- idea-discovery-contract.spec.ts chain-planning.controller.idea-appeal.spec.ts

      - name: Commit source fix and remove temporary patch files
        run: |
          rm .github/scripts/apply-idea-pool-runtime-fix.py
          rm .github/workflows/apply-idea-pool-runtime-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/chain/chain.controller.ts .github/scripts/apply-idea-pool-runtime-fix.py .github/workflows/apply-idea-pool-runtime-fix.yml
          git commit -m "fix: make idea broad search non-blocking"
          git push origin HEAD:main
