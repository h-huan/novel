name: Apply idea preselection pipeline
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Apply exact source patch
        run: node .github/patch-idea-preselection.cjs
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Typecheck
        working-directory: server
        run: npm run typecheck
      - name: Focused idea-discovery tests
        working-directory: server
        run: npx vitest run src/chain/idea-discovery-contract.spec.ts src/chain/chain-planning.controller.idea-appeal.spec.ts
      - name: Commit source change and remove one-time patch
        run: |
          git rm .github/patch-idea-preselection.cjs .github/workflows/apply-idea-preselection.yml
          git add server/src/chain/chain.controller.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: screen story premises before idea cards"
          git push origin HEAD:main
