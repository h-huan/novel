name: Apply latest diagnostic fixes

on:
  push:
    paths:
      - '.github/workflows/apply-latest-diagnostic-fixes.yml'
      - '.github/scripts/apply_latest_diagnostic_fixes.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source patches
        run: python .github/scripts/apply_latest_diagnostic_fixes.py
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Typecheck
        run: npm --prefix server run typecheck
      - name: Targeted regressions
        run: npm --prefix server test -- src/chain/idea-appeal-gate.story-regression.spec.ts src/chain/chain-route-architecture.spec.ts
      - name: Commit fixes and remove temporary runner
        shell: bash
        run: |
          rm .github/workflows/apply-latest-diagnostic-fixes.yml
          rm .github/scripts/apply_latest_diagnostic_fixes.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix: close latest diagnostic generation gaps'
          git push origin HEAD:main
