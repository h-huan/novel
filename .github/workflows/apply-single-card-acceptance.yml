name: Apply single-card acceptance fixture

on:
  push:
    paths:
      - '.github/workflows/apply-single-card-acceptance.yml'
      - '.github/scripts/update_single_card_acceptance.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply acceptance fixture update
        run: |
          python .github/scripts/update_single_card_acceptance.py
      - name: Install server dependencies
        run: |
          npm ci --prefix server
      - name: Typecheck
        run: |
          npm --prefix server run typecheck
      - name: Acceptance regression
        run: |
          npm --prefix server run test:acceptance -- src/acceptance/generation-diagnostics.acceptance.spec.ts
      - name: Idea regressions
        run: |
          npm --prefix server test -- src/chain/idea-discovery-contract.spec.ts src/chain/chain-route-architecture.spec.ts src/chain/idea-appeal-gate.story-regression.spec.ts
      - name: Commit fixture update and remove temporary runner
        shell: bash
        run: |
          rm .github/workflows/apply-single-card-acceptance.yml
          rm .github/scripts/update_single_card_acceptance.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'test: align idea acceptance with one-card structuring'
          git push origin HEAD:main
