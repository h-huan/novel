name: Apply single idea card structuring

on:
  push:
    paths:
      - '.github/workflows/apply-single-idea-card-structuring.yml'
      - '.github/scripts/apply_single_idea_card_structuring.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair staging anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply_single_idea_card_structuring.py')
          s = p.read_text(encoding='utf-8')
          if 'import re\n' not in s:
              s = s.replace('from pathlib import Path\n', 'from pathlib import Path\nimport re\n', 1)
          start = s.index('old_schema_prefix = ')
          end = s.index('\nold_auto =', start)
          replacement = r'''controller, schema_replacements = re.subn(
              r'\\?"sourcePremiseId\\?"\s*:\s*\\?"P1\\?"\s*,',
              '',
              controller,
              count=1,
          )
          if schema_replacements != 1:
              raise SystemExit('output schema sourcePremiseId anchor missing')
          '''
          s = s[:start] + replacement + s[end:]
          old_assertions = "    expect(directive).not.toContain('sourcePremiseId');\n    expect(directive).not.toContain('premiseId');"
          new_assertion = "    expect(directive).toContain('不要输出 premiseId、sourcePremiseId');"
          if old_assertions not in s:
              raise SystemExit('single-card identity assertion anchor missing')
          s = s.replace(old_assertions, new_assertion, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply source patch
        run: |
          python .github/scripts/apply_single_idea_card_structuring.py
      - name: Install server dependencies
        run: |
          npm ci --prefix server
      - name: Typecheck
        run: |
          npm --prefix server run typecheck
      - name: Targeted regressions
        run: |
          npm --prefix server test -- src/chain/idea-discovery-contract.spec.ts src/chain/chain-route-architecture.spec.ts src/chain/idea-appeal-gate.story-regression.spec.ts
      - name: Commit source fix and remove temporary runner
        shell: bash
        run: |
          rm .github/workflows/apply-single-idea-card-structuring.yml
          rm .github/scripts/apply_single_idea_card_structuring.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix: structure selected idea cards one by one'
          git push origin HEAD:main
