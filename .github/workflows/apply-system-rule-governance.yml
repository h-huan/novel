name: Apply system rule governance
# trigger: retry-14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-system-rule-governance.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply transparent governance patch
        run: |
          set -euxo pipefail
          python tools/system-rule-governance/bootstrap/prebuilt_part_0.py
          python tools/system-rule-governance/bootstrap/prebuilt_part_1.py
          python tools/system-rule-governance/bootstrap/prebuilt_small_0.py
          python tools/system-rule-governance/bootstrap/prebuilt_small_1.py
          python tools/system-rule-governance/bootstrap/prebuilt_small_2.py
          python tools/system-rule-governance/bootstrap/prebuilt_small_3.py
          python tools/system-rule-governance/bootstrap/complete_missing_rules.py
          python tools/system-rule-governance/bootstrap/enrich_normative_contracts.py
          python tools/system-rule-governance/bootstrap/align_gen_qlt_registry.py
          python tools/system-rule-governance/bootstrap/patch_core.py
          python tools/system-rule-governance/bootstrap/fix_idea_semantic_gate.py
          python tools/system-rule-governance/bootstrap/patch_hardline.py
          python tools/system-rule-governance/bootstrap/fix_hardline_spec_syntax.py
          python tools/system-rule-governance/bootstrap/retire_hardline_quota_tests.py
          python tools/system-rule-governance/bootstrap/patch_platform.py
          python tools/system-rule-governance/bootstrap/patch_chain_runner.py
          git diff --check
          python - <<'PY'
          import re
          from pathlib import Path
          doc=Path('QUALITY_EXECUTION.md').read_text()
          reg=Path('server/shared/src/system-workflow-rules.registry.ts').read_text()
          doc_ids=re.findall(r'\[([A-Z]+-\d{3})\s*·\s*P[0-3]\]',doc)
          reg_ids=re.findall(r"id: '([A-Z]+-\d{3})'",reg)
          assert len(doc_ids)==58 and len(set(doc_ids))==58, (len(doc_ids),len(set(doc_ids)))
          assert len(reg_ids)==58 and len(set(reg_ids))==58, (len(reg_ids),len(set(reg_ids)))
          assert set(doc_ids)==set(reg_ids), sorted(set(doc_ids)^set(reg_ids))
          semantic={
            'GEN-001':'六个必填执行维度',
            'GEN-002':'灵感继承',
            'GEN-003':'公共规则只由 Registry 注入',
            'GEN-004':'正文执行 ChapterPlan',
            'GEN-005':'结构化输出与小说规则分离',
            'GEN-006':'角色动机、声音与知识边界',
            'GEN-007':'正文篇幅与场景扩写边界',
            'QLT-006':'灵感吸引力',
            'QLT-007':'标题与首屏',
          }
          for rule_id, anchor in semantic.items():
            hit=re.search(rf"id: '{rule_id}', name: '([^']+)'",reg)
            assert hit and anchor in hit.group(1), (rule_id, hit.group(1) if hit else None)
            doc_hit=re.search(rf'^###\s+.*{re.escape(anchor)}.*\[{rule_id}\s*·\s*P[0-3]\]',doc,re.M)
            assert doc_hit, (rule_id, anchor, 'document semantic mismatch')
          assert 'prosePassed' in doc and 'prosePassed' in reg
          assert '具体必需事件' in doc and '具体必需事件' in reg
          assert '终章按合同结局或余韵收束' in doc and '终章按合同结局或余韵收束' in reg
          print('Rule ID exact-set and normative contract alignment OK:',len(doc_ids))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Server install
        working-directory: server
        run: npm ci

      - name: Server script syntax
        working-directory: server
        run: node --check ../verify-local.mjs

      - name: Server typecheck
        working-directory: server
        run: npm run typecheck

      - name: Server build
        working-directory: server
        run: npm run build

      - name: Governance test - module standards service
        working-directory: server
        run: node --no-warnings node_modules/vitest/vitest.mjs run src/modules/module-standards/module-standards.service.spec.ts

      - name: Governance test - public rule source
        working-directory: server
        run: node --no-warnings node_modules/vitest/vitest.mjs run src/modules/module-standards/public-rule-source.spec.ts

      - name: Governance test - source fact consistency
        working-directory: server
        run: node --no-warnings node_modules/vitest/vitest.mjs run src/chain/source-fact-consistency.spec.ts

      - name: Governance test - source countdown consistency
        working-directory: server
        run: node --no-warnings node_modules/vitest/vitest.mjs run src/chain/source-countdown-consistency.spec.ts

      - name: Governance test - source rule consistency
        working-directory: server
        run: node --no-warnings node_modules/vitest/vitest.mjs run src/chain/source-rule-consistency.spec.ts

      - name: Governance test - real LLM standards injection
        working-directory: server
        env:
          DEEPSEEK_API_KEY: ''
          OPENAI_API_KEY: ''
        run: node --no-warnings node_modules/vitest/vitest.mjs run src/chain/real-llm.standards.spec.ts

      - name: Governance test - generation metrics ruleset
        working-directory: server
        run: node --no-warnings node_modules/vitest/vitest.mjs run src/modules/generation-metrics/generation-metrics.ruleset.spec.ts

      - name: Governance test - idea discovery contract
        working-directory: server
        run: node --no-warnings node_modules/vitest/vitest.mjs run src/chain/idea-discovery-contract.spec.ts

      - name: Governance test - idea appeal gate
        working-directory: server
        run: node --no-warnings node_modules/vitest/vitest.mjs run src/chain/idea-appeal-gate.service.spec.ts

      - name: Governance test - hardline scanner
        working-directory: server
        run: node --no-warnings node_modules/vitest/vitest.mjs run src/chain/hardline-scanner.spec.ts

      - name: Server unit tests
        working-directory: server
        env:
          DEEPSEEK_API_KEY: ''
          OPENAI_API_KEY: ''
        run: npm test

      - name: Server acceptance tests
        working-directory: server
        env:
          DEEPSEEK_API_KEY: ''
          OPENAI_API_KEY: ''
        run: npm run test:acceptance

      - name: Server API E2E
        working-directory: server
        env:
          DEEPSEEK_API_KEY: ''
          OPENAI_API_KEY: ''
        run: npm run test:e2e

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Desktop install
        working-directory: desktop
        run: npm ci

      - name: Desktop script syntax
        working-directory: desktop
        run: node --check scripts/dev.js && node --check scripts/prepare-server-runtime.js

      - name: Desktop typecheck
        working-directory: desktop
        run: npm run typecheck

      - name: Desktop unit tests
        working-directory: desktop
        run: npm test

      - name: Desktop build
        working-directory: desktop
        run: npm run build

      - name: Desktop install Chromium
        working-directory: desktop
        run: npx playwright install --with-deps chromium

      - name: Desktop Quality cockpit E2E
        working-directory: desktop
        env:
          DEEPSEEK_API_KEY: ''
          OPENAI_API_KEY: ''
        run: npm run test:e2e:quality

      - name: Commit verified governance refactor
        run: |
          set -euxo pipefail
          rm -rf tools/system-rule-governance
          rm -f .github/workflows/apply-system-rule-governance.yml
          git diff --check
          git config user.name 'openai-codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'refactor: unify system workflow rule governance'
          git push origin HEAD:main
