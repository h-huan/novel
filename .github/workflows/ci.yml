name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify local acceptance script syntax
        run: node --check ../verify-local.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Acceptance tests
        run: npm run test:acceptance
      - name: API E2E
        run: npm run test:e2e
      - name: Detect real LLM credential
        id: real_llm
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DEEPSEEK_API_KEY secret not configured; real-model golden path will be skipped."
          fi
      - name: Real LLM golden path
        if: steps.real_llm.outputs.enabled == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          REAL_LLM_MODEL: ${{ vars.REAL_LLM_MODEL }}
        run: RUN_REAL_LLM_E2E=1 npm run test:e2e -- --grep "Real novel golden path"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: server-test-results
          path: server/test-results
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify server launcher syntax
        run: node --check scripts/dev.js && node --check scripts/prepare-server-runtime.js
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Quality cockpit E2E
        run: npm run test:e2e:quality
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-results
          path: desktop/test-results