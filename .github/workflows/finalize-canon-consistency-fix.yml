name: Finalize canon consistency fix
on:
  push:
    branches: [fix/canon-creation-consistency-20261003]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canon-creation-consistency-20261003
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded final replacements
        run: |
          # Canon wording + strict Guard were committed directly before this run.
          # Remove those two already-applied sections from the one-shot patch copy
          # so the remaining guarded replacements stay exact and fail closed.
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/finalize-canon-consistency-fix.py')
          text = p.read_text(encoding='utf-8-sig')
          section1 = text.index('# -----------------------------------------------------------------------------\n# 1) Canon policy wording')
          section3 = text.index('# -----------------------------------------------------------------------------\n# 3) Long creation batch')
          p.write_text(text[:section1] + text[section3:], encoding='utf-8')
          PY
          python .github/scripts/finalize-canon-consistency-fix.py
          python .github/scripts/finalize-safe-cross-stage-repair.py
          python .github/scripts/finalize-world-invariant-boundary.py
          # First-world creation is one atomic operation: the main row and its
          # initial profile are written in the same transaction, then frozen.
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print(f'patched {label}: {path}')

          service = 'server/src/modules/world-setting/world-setting.service.ts'
          replace_once(
              service,
              "    this.repo.insert({",
              "    const db = this.databaseService.getDb();\n    db.exec('BEGIN IMMEDIATE');\n    try {\n      this.repo.insert({",
              'begin atomic first-world create',
          )
          replace_once(
              service,
              "    });\n\n    return this.toResponse(this.repo.findById(id)!);",
              "      });\n\n      const initialProfile: Record<string, string> = {\n        synopsis: dto.workIntro || '',\n        basic_info: [dto.name, dto.era].filter(Boolean).join('；'),\n        era: dto.era || '',\n        rules: (dto.constraints || []).map(item => item.rule).filter(Boolean).join('\\n'),\n        system_mechanics: dto.systemSettings || '',\n        culture_customs: dto.culturalSettings || '',\n        naming_rules: dto.namingRules || '',\n        scale_plan: dto.dataPlanning || '',\n        hierarchy_rules: buildCanonPolicyDirective(),\n        supplementary: dto.censorshipRules || '',\n      };\n      const profileValues = WORLD_PROFILE_FIELDS.map(field => String(initialProfile[field] || ''));\n      db.prepare(`INSERT INTO world_system_profiles (id, project_id, world_setting_id, ${WORLD_PROFILE_FIELDS.join(', ')}, created_at, updated_at) VALUES (?, ?, ?, ${WORLD_PROFILE_FIELDS.map(() => '?').join(', ')}, ?, ?)` )\n        .run(uuid(), projectId, id, ...profileValues, now, now);\n      db.exec('COMMIT');\n    } catch (error) {\n      db.exec('ROLLBACK');\n      throw error;\n    }\n\n    return this.toResponse(this.repo.findById(id)!);",
              'write initial world profile before freeze',
          )

          controller = 'server/src/modules/world-setting/world-setting.controller.ts'
          p = Path(controller)
          text = p.read_text(encoding='utf-8-sig')
          start = "    // 创建阶段由生成链负责上层→下层审查；这里只建立唯一世界观档案。\n    this.service.updateProfile(projectId, result.id, {"
          end = "    const sync = await this.indexWorldSetting(projectId, result);"
          if text.count(start) != 1:
              raise RuntimeError(f'controller atomic create start marker expected 1 match, got {text.count(start)}')
          a = text.index(start)
          try:
              b = text.index(end, a)
          except ValueError as error:
              raise RuntimeError('controller atomic create end marker not found after create block') from error
          text = text[:a] + "    // service.create 已在同一事务写入初始 profile；返回后世界观立即冻结。\n" + text[b:]
          p.write_text(text, encoding='utf-8')
          print('patched controller to avoid post-freeze updateProfile')
          PY
      - name: Server dependencies
        working-directory: server
        run: npm ci
      - name: Server typecheck
        working-directory: server
        run: npm run typecheck
      - name: Server build
        working-directory: server
        run: npm run build
      - name: Canon and creation regression tests
        working-directory: server
        run: npx vitest run src/modules/canon/canon-policy.spec.ts src/modules/generation-metrics/generated-canon-guard.service.spec.ts src/modules/world-setting/world-setting.service.spec.ts src/chain/cross-stage-patch.spec.ts src/chain/generation-recovery.service.spec.ts src/chain/source-hierarchy-review.spec.ts src/chain/creation-consistency-architecture.spec.ts
      - name: Server unit suite
        working-directory: server
        run: npm test
      - name: Server acceptance suite
        working-directory: server
        run: npm run test:acceptance
      - name: Server e2e suite
        working-directory: server
        run: npm run test:e2e
      - name: Desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Desktop typecheck
        working-directory: desktop
        run: npm run typecheck
      - name: Desktop unit suite
        working-directory: desktop
        run: npm test
      - name: Desktop build
        working-directory: desktop
        run: npm run build
      - name: Desktop runtime packaging check
        working-directory: desktop
        run: npm run check:runtime-packaging
      - name: Remove one-shot patch machinery
        run: rm -f .github/scripts/finalize-canon-consistency-fix.py .github/scripts/finalize-safe-cross-stage-repair.py .github/scripts/finalize-world-invariant-boundary.py .github/workflows/finalize-canon-consistency-fix.yml
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: freeze world canon and minimize repair blast radius"
          git push origin HEAD:fix/canon-creation-consistency-20261003
