name: Governance acceptance diagnostics
# trigger: acceptance-1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/governance-unit-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose-acceptance-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply governance patch
        run: |
          set -euo pipefail
          python tools/system-rule-governance/bootstrap/prebuilt_part_0.py
          python tools/system-rule-governance/bootstrap/prebuilt_part_1.py
          python tools/system-rule-governance/bootstrap/prebuilt_small_0.py
          python tools/system-rule-governance/bootstrap/prebuilt_small_1.py
          python tools/system-rule-governance/bootstrap/prebuilt_small_2.py
          python tools/system-rule-governance/bootstrap/prebuilt_small_3.py
          python tools/system-rule-governance/bootstrap/complete_missing_rules.py
          python tools/system-rule-governance/bootstrap/enrich_normative_contracts.py
          python tools/system-rule-governance/bootstrap/align_gen_qlt_registry.py
          python tools/system-rule-governance/bootstrap/patch_core.py
          python tools/system-rule-governance/bootstrap/fix_idea_semantic_gate.py
          python tools/system-rule-governance/bootstrap/patch_hardline.py
          python tools/system-rule-governance/bootstrap/fix_hardline_spec_syntax.py
          python tools/system-rule-governance/bootstrap/retire_hardline_quota_tests.py
          python tools/system-rule-governance/bootstrap/patch_platform.py
          python tools/system-rule-governance/bootstrap/patch_chain_runner.py
          python tools/system-rule-governance/bootstrap/fix_full_unit_compat.py
          python tools/system-rule-governance/bootstrap/fix_acceptance_compat.py
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Run acceptance suite
        working-directory: server
        env:
          DEEPSEEK_API_KEY: ''
          OPENAI_API_KEY: ''
        run: npm run test:acceptance
