name: One-shot organization-map Canon provenance guard
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/one-shot-guard-organization-map-canon.py'
      - '.github/workflows/one-shot-guard-organization-map-canon.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact migration
        run: python .github/scripts/one-shot-guard-organization-map-canon.py
      - name: Verify server typecheck before commit
        working-directory: server
        run: |
          npm ci
          npm run typecheck
      - name: Remove one-shot artifacts
        run: rm .github/scripts/one-shot-guard-organization-map-canon.py .github/workflows/one-shot-guard-organization-map-canon.yml
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/src/chain/chain.controller.ts .github/scripts/one-shot-guard-organization-map-canon.py .github/workflows/one-shot-guard-organization-map-canon.yml
          git commit -m 'refactor: guard organization and map Canon with source run'
          git push origin HEAD:main
