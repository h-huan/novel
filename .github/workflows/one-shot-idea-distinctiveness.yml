name: One-shot idea distinctiveness migration
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/one-shot-idea-distinctiveness.py'
      - '.github/workflows/one-shot-idea-distinctiveness.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact idea migration
        run: python .github/scripts/one-shot-idea-distinctiveness.py
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Verify acceptance script syntax
        run: node --check verify-local.mjs
      - name: Typecheck server
        working-directory: server
        run: npm run typecheck
      - name: Unit test server
        working-directory: server
        run: npm test -- --run
      - name: Build server
        working-directory: server
        run: npm run build
      - name: Remove one-shot artifacts
        run: rm .github/scripts/one-shot-idea-distinctiveness.py .github/workflows/one-shot-idea-distinctiveness.yml
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/src/chain/idea-appeal-gate.service.ts server/src/chain/idea-appeal-gate.service.spec.ts server/src/chain/chain.controller.ts verify-local.mjs .github/scripts/one-shot-idea-distinctiveness.py .github/workflows/one-shot-idea-distinctiveness.yml
          git commit -m 'fix: reject generic story premises before project creation'
          git push origin HEAD:main
# rerun after isolating ranking behavior from content admissibility