name: One-shot idea hook contract alignment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'run idea hook contract alignment')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact contract alignment
        run: python .github/scripts/patch-idea-hook-contract.py

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Verify server
        working-directory: server
        run: |
          npm run typecheck
          npm test -- --run
          npm run build

      - name: Remove one-shot artifacts
        run: git rm .github/workflows/one-shot-idea-hook-contract.yml .github/scripts/patch-idea-hook-contract.py

      - name: Commit alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/chain/chain.controller.ts server/src/chain/idea-appeal-gate.service.ts server/src/chain/idea-appeal-gate.service.spec.ts .github/workflows/one-shot-idea-hook-contract.yml .github/scripts/patch-idea-hook-contract.py
          git diff --cached --quiet && exit 1
          git commit -m "fix: align idea hook generation with appeal gate"
          git push
