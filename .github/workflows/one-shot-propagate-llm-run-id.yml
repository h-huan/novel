name: One-shot propagate LLM run provenance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-propagate-llm-run-id.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Propagate generation run id through llmCallWithRetry
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server/src/chain/chain.controller.ts')
          text = path.read_text(encoding='utf-8')
          start_marker = '  private async llmCallWithRetry<T>('
          end_marker = '\n  private generateId(): string {'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit(f'unexpected llmCallWithRetry markers: start={text.count(start_marker)} end={text.count(end_marker)}')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          method = text[start:end]

          old_return = "Promise<{ data: T | null; rawContent: string; warnings: string[]; usage?: { promptTokens: number; completionTokens: number; totalTokens: number } }>"
          new_return = "Promise<{ data: T | null; rawContent: string; warnings: string[]; usage?: { promptTokens: number; completionTokens: number; totalTokens: number }; runId?: string }>"
          if method.count(old_return) != 1:
              raise SystemExit(f'unexpected return signature count={method.count(old_return)}')
          method = method.replace(old_return, new_return, 1)

          raw_marker = "    let rawContent = '';\n"
          if method.count(raw_marker) != 1:
              raise SystemExit(f'unexpected rawContent marker count={method.count(raw_marker)}')
          method = method.replace(raw_marker, raw_marker + '    let runId: string | undefined;\n', 1)

          assignment = '        rawContent = resp.content;\n'
          if method.count(assignment) != 1:
              raise SystemExit(f'unexpected response content assignment count={method.count(assignment)}')
          method = method.replace(assignment, assignment + '        runId = resp.runId;\n', 1)

          return_tail = 'warnings, usage };'
          count = method.count(return_tail)
          if count < 3:
              raise SystemExit(f'expected multiple successful returns, found={count}')
          method = method.replace(return_tail, 'warnings, usage, runId };')
          if return_tail in method:
              raise SystemExit('a successful llmCallWithRetry return still drops runId')
          if 'runId = resp.runId;' not in method or 'runId?: string' not in method:
              raise SystemExit('runId provenance patch incomplete')

          text = text[:start] + method + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Server typecheck
        working-directory: server
        run: npm run typecheck
      - name: Server unit tests
        working-directory: server
        run: npm test
      - name: Commit patch and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-propagate-llm-run-id.yml
          git add server/src/chain/chain.controller.ts
          git commit -m "refactor: preserve generation run proof through retry wrapper"
          git push origin HEAD:main
