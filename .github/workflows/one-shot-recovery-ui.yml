name: One-shot stalled creation recovery UI migration
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/one-shot-recovery-ui.py'
      - '.github/workflows/one-shot-recovery-ui.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact recovery UI migration
        run: python .github/scripts/one-shot-recovery-ui.py
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Typecheck desktop
        working-directory: desktop
        run: npm run typecheck
      - name: Unit test desktop
        working-directory: desktop
        run: npm test -- --run
      - name: Remove one-shot artifacts
        run: rm .github/scripts/one-shot-recovery-ui.py .github/workflows/one-shot-recovery-ui.yml
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41813423+h-huan@users.noreply.github.com'
          git add desktop/src/renderer/pages/ProjectListPage.tsx .github/scripts/one-shot-recovery-ui.py .github/workflows/one-shot-recovery-ui.yml
          git commit -m 'fix: expose stalled project recovery in project list'
          git push origin HEAD:main
