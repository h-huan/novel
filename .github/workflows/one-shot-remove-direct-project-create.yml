name: One-shot remove direct project creation path

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-remove-direct-project-create.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            desktop/package-lock.json
      - name: Remove second project creation path
        run: python .github/scripts/one-shot-remove-direct-project-create.py
      - name: Reject direct-create leftovers
        run: |
          test ! -e server/src/modules/project/dto/create-project.dto.ts
          ! grep -R "CreateProjectDto" -n server/src desktop/src server/e2e
          ! grep -R "createProject: async" -n desktop/src
          ! grep -R "validProjectPayload" -n server/e2e
          ! grep -R "creationSource\|ideaSeed\|confirmedIdea" -n server/e2e
          ! grep -R "request.post.*\/projects" -n server/e2e/flows --exclude='project-crud.spec.ts'
          ! grep -R "@Post()" -n server/src/modules/project/project.controller.ts
          ! grep -R "service.create(dto" -n server/src/modules/project
      - name: Verify server
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run test:acceptance
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Verify desktop
        working-directory: desktop
        run: |
          npm ci
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Commit cleanup and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-remove-direct-project-create.yml
          git rm .github/scripts/one-shot-remove-direct-project-create.py
          git add server/src server/e2e server/docs desktop/src
          git commit -m "refactor: remove direct project creation backdoor"
          git push origin HEAD:main
