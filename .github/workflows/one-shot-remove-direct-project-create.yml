name: One-shot remove direct project creation path

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-remove-direct-project-create.yml
      - .github/scripts/one-shot-remove-direct-project-create.py
      - .github/scripts/one-shot-migrate-project-create-tests.py
      - server/e2e/playwright.config.ts

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            desktop/package-lock.json
      - name: Remove second project creation path
        run: |
          python .github/scripts/one-shot-remove-direct-project-create.py
          python .github/scripts/one-shot-migrate-project-create-tests.py
      - name: Reject direct-create leftovers
        run: |
          test ! -e server/src/modules/project/dto/create-project.dto.ts
          if grep -R "CreateProjectDto\|validProjectPayload" -n server/src server/e2e desktop/src; then exit 1; fi
          if grep -R "creationSource\|ideaSeed\|confirmedIdea" -n server/e2e; then exit 1; fi
          if grep -R "createProject: async" -n desktop/src; then exit 1; fi
          if grep -R -F 'request.post(`${BASE}/projects`' -n server/e2e/flows --exclude='project-crud.spec.ts'; then exit 1; fi
          if grep -R "@Post()" -n server/src/modules/project/project.controller.ts; then exit 1; fi
          if grep -R "service.create(dto" -n server/src/modules/project; then exit 1; fi
      - name: Verify server
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run test:acceptance
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Verify desktop
        working-directory: desktop
        run: |
          npm ci
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Commit cleanup and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-remove-direct-project-create.yml
          git rm .github/scripts/one-shot-remove-direct-project-create.py
          git rm .github/scripts/one-shot-migrate-project-create-tests.py
          git add server/src server/e2e server/docs desktop/src
          git commit -m "refactor: remove direct project creation backdoor"
          git push origin HEAD:main
