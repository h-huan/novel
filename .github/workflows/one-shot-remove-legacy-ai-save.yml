name: One-shot remove legacy AI save path

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-remove-legacy-ai-save.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            desktop/package-lock.json

      - name: Remove legacy AI save compatibility path
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 occurrence, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Renderer: generated/continued body must use the dedicated guarded Canon endpoint.
          replace_once(
              'desktop/src/renderer/pages/WritingPage.tsx',
              """        const response = await api.put(\n          `/projects/${projectId}/chapters/${targetChapterId}`,\n          { content, source: 'ai_generated' as const },\n          // 章节保存是单条 SQL 写入，20s 超时足够；过久不回必是网络/锁表，\n          // 让作者看到\"超时\"远比让\"保存中\"停留数分钟直观。\n          20000,\n        );""",
              """        const response = await api.post(\n          `/projects/${projectId}/chapters/${targetChapterId}/accept-generated`,\n          { content },\n          // Canon 提交只做生成凭证验签 + 单章事务写入；过久不回视为网络/锁表。\n          20000,\n        );""",
              'WritingPage generated save',
          )

          # 2) Public chapter DTO no longer exposes an AI identity/source switch.
          replace_once(
              'server/src/modules/chapter/dto/chapter.dto.ts',
              "import { IsString, IsOptional, IsNumber, IsIn } from 'class-validator';",
              "import { IsString, IsOptional, IsNumber } from 'class-validator';",
              'chapter dto validator import',
          )
          p = Path('server/src/modules/chapter/dto/chapter.dto.ts')
          text = p.read_text(encoding='utf-8')
          start_marker = "  /**\n   * 临时迁移信号：ai_generated 不再授权 ChapterService 直接写库，Controller 必须转入\n"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('chapter dto legacy source block not found')
          end_marker = "  source?: 'manual' | 'ai_generated';\n"
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('chapter dto source field end not found')
          end += len(end_marker)
          p.write_text(text[:start] + text[end:], encoding='utf-8')

          # 3) Public PUT is author/manual only. AI Canon uses accept-generated only.
          p = Path('server/src/modules/chapter/chapter.controller.ts')
          text = p.read_text(encoding='utf-8')
          old = """  /**\n   * 公共 PUT 默认只代表作者手工编辑。滚动升级期间旧前端仍会发送 source=ai_generated；\n   * 该信号只能把请求转入严格验签服务，绝不能直接进入 ChapterService.update。\n   */\n  @Put(':id')\n  update(\n    @Param('projectId') projectId: string,\n    @Param('id') id: string,\n    @Body() dto: UpdateChapterDto,\n  ) {\n    if (dto.source === 'ai_generated') {\n      return this.generatedCommit.commit(projectId, id, dto.content || '');\n    }\n    const { source: _source, ...authorEdit } = dto;\n    return this.service.update(id, authorEdit);\n  }\n"""
          new = """  /** 公共 PUT 永远只代表作者手工编辑；AI 正文只能走 accept-generated。 */\n  @Put(':id')\n  update(@Param('id') id: string, @Body() dto: UpdateChapterDto) {\n    return this.service.update(id, dto);\n  }\n"""
          if text.count(old) != 1:
              raise SystemExit(f'chapter controller legacy PUT block: expected 1, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 4) ChapterService no longer owns a save-then-review callback.
          p = Path('server/src/modules/chapter/chapter.service.ts')
          text = p.read_text(encoding='utf-8')
          response_field = """  /** AI 生成正文保存后是否已排队自动质检 */\n  autoQualityScheduled?: boolean;\n"""
          if text.count(response_field) != 1:
              raise SystemExit(f'autoQualityScheduled field: expected 1, found {text.count(response_field)}')
          text = text.replace(response_field, '', 1)

          start_marker = "  /**\n   * AI 生成正文 canonical 保存后的自动质检回调，由 WritingQualityService.onModuleInit 注册。\n"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('ChapterService autoQualityRunner block start not found')
          end_marker = "  create(projectId: string, dto: CreateChapterDto): ChapterResponse {"
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('ChapterService create marker not found')
          text = text[:start] + end_marker + text[end + len(end_marker):]

          start_marker = "      // AI 生成正文 canonical 保存：异步自动跑一次七维质检 + 标签契合（质量分/问题落库并同步看板）。\n"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('ChapterService post-save auto quality block start not found')
          end_marker = "      }\n    } else {\n"
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('ChapterService post-save auto quality block end not found')
          # preserve the closing brace for contentChanged before the else branch
          text = text[:start] + "    } else {\n" + text[end + len(end_marker):]
          p.write_text(text, encoding='utf-8')

          # 5) WritingQualityService keeps manual review and stale-running recovery,
          #    but no longer registers a save-after-write quality callback.
          p = Path('server/src/modules/writing-quality/writing-quality.service.ts')
          text = p.read_text(encoding='utf-8')
          start_marker = "  /**\n   * 反向依赖用「注册回调」而非构造注入（ChapterModule 被本模块依赖，不能再反向 import）。\n"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('WritingQuality legacy registration doc start not found')
          keep_marker = "    // 进程重启/崩溃会把章节永久留在 running"
          keep = text.find(keep_marker, start)
          if keep < 0:
              raise SystemExit('WritingQuality stale-running cleanup marker not found')
          replacement = "  /** 服务启动时只清理上一次进程遗留的质检 running 租约。 */\n  onModuleInit(): void {\n"
          text = text[:start] + replacement + text[keep:]
          p.write_text(text, encoding='utf-8')
          PY

      - name: Reject legacy AI save markers
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = [Path('server/src'), Path('desktop/src')]
          forbidden = ["source: 'ai_generated'", 'registerAutoQualityRunner', 'autoQualityScheduled']
          hits = []
          for root in roots:
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix not in {'.ts', '.tsx'}:
                      continue
                  text = p.read_text(encoding='utf-8', errors='ignore')
                  for marker in forbidden:
                      if marker in text:
                          hits.append(f'{p}: {marker}')
          if hits:
              raise SystemExit('legacy AI save markers remain:\n' + '\n'.join(hits))
          PY

      - name: Install and verify server
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run test:acceptance

      - name: Install and verify desktop
        working-directory: desktop
        run: |
          npm ci
          npm run typecheck
          npm test -- --run
          npm run build

      - name: Commit cleanup and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-remove-legacy-ai-save.yml
          git add server/src desktop/src
          git commit -m "refactor: remove legacy AI chapter save path"
          git push origin HEAD:main
