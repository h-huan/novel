name: One-shot remove world compatibility code

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-remove-world-compat.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Remove obsolete world compatibility paths
        run: |
          python - <<'PY'
          from pathlib import Path

          controller = Path('server/src/modules/world-setting/world-setting.controller.ts')
          text = controller.read_text(encoding='utf-8')
          text = text.replace('  Query,\n', '', 1)
          text = text.replace("import { ApiTags, ApiOperation } from '@nestjs/swagger';", "import { ApiTags } from '@nestjs/swagger';", 1)

          find_start = text.index('  @Get()\n  findAll(')
          find_end = text.index("  @Get(':id/profile')", find_start)
          text = text[:find_start] + "  @Get()\n  findAll(@Param('projectId') projectId: string) {\n    return this.service.findByProjectId(projectId);\n  }\n\n" + text[find_end:]

          simple_start_marker = '  /**\n   * 保存短篇世界观设定\n'
          summary_marker = '  /** Keep the full persisted profile available to retrieval, not just basic fields. */\n'
          if text.count(simple_start_marker) != 1 or text.count(summary_marker) != 1:
              raise SystemExit(f'unexpected simple route markers: start={text.count(simple_start_marker)} end={text.count(summary_marker)}')
          simple_start = text.index(simple_start_marker)
          simple_end = text.index(summary_marker, simple_start)
          text = text[:simple_start] + text[simple_end:]
          forbidden_controller = ['mode === \'simple\'', "@Put('simple')", 'upsertSimpleSettings(', 'getSimpleSettings(', 'ApiOperation', '@Query(']
          leftovers = [item for item in forbidden_controller if item in text]
          if leftovers:
              raise SystemExit(f'world compatibility controller leftovers: {leftovers}')
          controller.write_text(text, encoding='utf-8')

          service = Path('server/src/modules/world-setting/world-setting.service.ts')
          source = service.read_text(encoding='utf-8')
          legacy_start_marker = '  /* Legacy summary implementation is retained below for source compatibility. */\n'
          check_marker = '  checkConsistency(projectId: string, content: string) {'
          if source.count(legacy_start_marker) != 1 or source.count(check_marker) != 1:
              raise SystemExit(f'unexpected legacy summary markers: start={source.count(legacy_start_marker)} check={source.count(check_marker)}')
          legacy_start = source.index(legacy_start_marker)
          check_start = source.index(check_marker, legacy_start)
          source = source[:legacy_start] + source[check_start:]

          simple_service_marker = '  /**\n   * 获取短篇世界观设定\n'
          response_marker = '  private toResponse(row: WorldSettingRow): WorldSettingResponse {'
          if source.count(simple_service_marker) != 1 or source.count(response_marker) != 1:
              raise SystemExit(f'unexpected simple service markers: start={source.count(simple_service_marker)} response={source.count(response_marker)}')
          simple_service_start = source.index(simple_service_marker)
          response_start = source.index(response_marker, simple_service_start)
          source = source[:simple_service_start] + source[response_start:]

          forbidden_service = ['legacyWritingSummary(', 'getSimpleSettings(', 'upsertSimpleSettings(', 'Legacy summary implementation']
          leftovers = [item for item in forbidden_service if item in source]
          if leftovers:
              raise SystemExit(f'world compatibility service leftovers: {leftovers}')
          service.write_text(source, encoding='utf-8')
          PY
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Server typecheck
        working-directory: server
        run: npm run typecheck
      - name: Server unit tests
        working-directory: server
        run: npm test
      - name: Commit cleanup and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-remove-world-compat.yml
          git add server/src/modules/world-setting/world-setting.controller.ts server/src/modules/world-setting/world-setting.service.ts
          git commit -m "refactor: remove obsolete world-setting compatibility paths"
          git push origin HEAD:main
