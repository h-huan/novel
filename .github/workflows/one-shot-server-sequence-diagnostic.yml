name: One-shot server sequence diagnostic

on:
  push:
    branches: [main]

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, 'run server sequence diagnostic')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: server
        run: npm ci
      - name: Reproduce CI sequence before acceptance
        working-directory: server
        run: |
          node --check ../verify-local.mjs
          npm run typecheck
          npm run build
          npm test
      - name: Snapshot pre-acceptance state
        shell: bash
        run: |
          git status --short > server/pre-acceptance-state.txt
          find server -maxdepth 3 -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.json' \) -newermt '10 minutes ago' -print | sort >> server/pre-acceptance-state.txt || true
      - name: Run acceptance and capture output
        id: acceptance
        continue-on-error: true
        working-directory: server
        shell: bash
        run: |
          set -o pipefail
          npm run test:acceptance 2>&1 | tee acceptance.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-sequence-diagnostic
          path: |
            server/acceptance.log
            server/pre-acceptance-state.txt
      - name: Mark reproduction result
        if: steps.acceptance.outputs.status != '0'
        run: exit 1
